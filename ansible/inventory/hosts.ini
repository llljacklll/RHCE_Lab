# ============================================================
#  ANSIBLE/INVENTORY/HOSTS.INI — Inventario estático del laboratorio
# ------------------------------------------------------------
#  QUÉ ES: la traducción del grupo 'nodes' —al que apuntan todos
#  los playbooks con 'hosts: nodes'— a máquinas concretas: los 3
#  contenedores del laboratorio con su IP fija en la red interna.
#
#  ESTRUCTURA (formato INI de inventario de Ansible):
#   - [nodes]      → los 3 hosts con su 'ansible_host' (la IP).
#                    Un 'hosts: nodes' hace que el play corra en
#                    los 3 nodos (en paralelo por defecto).
#   - [nodes:vars] → variables de conexión comunes al grupo.
#
#  VARIABLES DE [nodes:vars] (clave=valor, una por línea):
#   - ansible_user / ansible_password
#       Usuario 'ansible' y su contraseña: las credenciales con
#       las que Ansible entra en cada nodo. Van en claro A
#       PROPÓSITO: es un laboratorio local aislado; en producción
#       tocaría claves SSH o vault, nunca texto en el inventario.
#   - ansible_become_password
#       Contraseña de sudo: la que usan los playbooks con
#       'become: true' para escalar a root dentro del nodo.
#   - ansible_python_interpreter
#       Fija el intérprete de Python de los nodos y evita el
#       aviso de autodescubrimiento en cada conexión.
#
#  REGLA DE FORMATO: los comentarios ocupan la línea completa.
#  El parser INI de Ansible NO admite un '#' al final de una
#  definición: 'node1 ansible_host=... # nota' dejaría de ser
#  un host válido. (Misma disciplina que en los YAML: comentarios
#  solo en línea completa.)
# ============================================================
[nodes]
node1 ansible_host=172.20.0.11
node2 ansible_host=172.20.0.12
node3 ansible_host=172.20.0.13

[nodes:vars]
ansible_user=ansible
ansible_password=ansible
ansible_become_password=ansible
ansible_python_interpreter=/usr/bin/python3
