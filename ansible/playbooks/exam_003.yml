# ============================================================
#  SOLUCIÓN DE REFERENCIA — EXAMEN 003 (DIFICULTAD: HARD)
#  Título: "EX294 Simulacro Oficial (LVM, Vault, Jinja2, Cron)"
# ------------------------------------------------------------
#  TAREAS QUE RESUELVE (alcance lab-wide: un play por nodo):
#    task_1 → VG 'vg_<nodo>' sobre el disco extra PROPIO del
#             nodo (node1:/dev/loop0, node2:/dev/loop2,
#             node3:/dev/loop4). device-mapper es GLOBAL al
#             kernel compartido: dos VG con el mismo nombre
#             chocan en /dev/mapper, y el filtro LVM de cada
#             nodo solo deja ver SUS loops → el dict
#             'disco_extra' mapea cada host al suyo.
#    task_2 → LV 'lv_datos' (500MB, XFS) en 'vg_<nodo>'
#    task_3 → /opt/app/config.txt con 'db_password' (Vault)
#    task_4 → Usuarios 'web01' y 'web02' con un loop Jinja2
#    task_5 → Cron de root: 'logger ExamenRHCE' cada 5 minutos
#
#  VAULT (files/secrets.yml está encriptado; 'db_password' es
#  top-level dentro del vault, se usa tal cual):
#      Vía interactiva:  ./lab.sh run --vault exam_003.yml
#      Contraseña del vault del laboratorio: RhceLab2026
#      (la contraseña del VAULT no es lo mismo que el VALOR
#       de db_password, que vive solo en el vault)
#      Vía no interactiva (la del motor):
#      docker exec -w /opt/ansible control \
#        ansible-playbook playbooks/exam_003.yml \
#        --vault-password-file files/.vault_pass
#
#  WORKAROUND LVM EN CONTENEDORES DOCKER (NO TOCAR):
#      Los contenedores no tienen udev → 'lvcreate' falla al
#      limpiar firmas del dispositivo. Los flags
#      '--wipesignatures n --zero n' son OBLIGATORIOS aquí.
#      En una máquina física no harían falta, pero no molestan.
# ============================================================

---
- name: "EXAM 003 :: Simulacro Hard EX294 (solución de referencia)"
  hosts: nodes
  become: true

  # --------------------------------------------------------
  # Variables del playbook:
  #   dev_users    → la lista que consume el loop de task_4
  #   disco_extra  → el loop PROPIO de cada nodo (enunciado
  #                  task_1; el filtro LVM oculta los ajenos)
  # --------------------------------------------------------
  vars:
    dev_users:
      - web01
      - web02

    disco_extra:
      node1: /dev/loop0
      node2: /dev/loop2
      node3: /dev/loop4

  tasks:

      # ========================================================
      # task_1 :: Volume Group 'vg_<nodo>' sobre el disco extra
      # del PROPIO nodo. 'lvg' ejecuta pvcreate + vgcreate por
      # debajo. El nombre lleva el nodo: vg_ + inventory_hostname
      # (el checker exige /dev/vg_<nodo>).
      # force: true permite reutilizar el disco aunque arrastre
      # firmas de una ejecución anterior del laboratorio.
      # ========================================================
      - name: "task_1 | Crear el Volume Group vg_{{ inventory_hostname }} en {{ disco_extra[inventory_hostname] }}"
        community.general.lvg:
          vg: "vg_{{ inventory_hostname }}"
          pvs: "{{ disco_extra[inventory_hostname] }}"
          force: true

      # ========================================================
      # task_2 :: LV 'lv_datos' (500MB) formateado en XFS
      # ========================================================

      # 2a) Limpieza idempotente: si el LV existe de una corrida
      #     anterior, se elimina para recrearlo al tamaño exacto.
      - name: "task_2 | Eliminar lv_datos si existiera (idempotencia)"
        ansible.builtin.command: "lvremove -f vg_{{ inventory_hostname }}/lv_datos"
        failed_when: false           # No es error que no exista
        changed_when: false          # Tampoco cuenta como cambio

      # 2b) Creación del LV (nombre y tamaño EXIGIDOS por el
      #     checker: lv_datos, 500M).
      #     NOTA: '--wipesignatures n --zero n' = workaround Docker.
      - name: "task_2 | Crear lv_datos de 500MB (flags Docker)"
        ansible.builtin.command: >
          lvcreate -L 500M -n lv_datos vg_{{ inventory_hostname }}
          --wipesignatures n --zero n

      # 2c) Formateo XFS (force permite re-runs del laboratorio).
      #     El módulo es no-interactivo: equivale a mkfs.xfs -f,
      #     nunca se cuelga esperando confirmación.
      - name: "task_2 | Formatear lv_datos en XFS"
        community.general.filesystem:
          fstype: xfs
          dev: "/dev/vg_{{ inventory_hostname }}/lv_datos"
          force: true

      # ========================================================
      # task_3 :: /opt/app/config.txt desde el VAULT
      # include_vars carga el fichero ENCRIPTADO: por eso este
      # playbook necesita la contraseña del vault (ver cabecera).
      # Ruta: playbooks/../files/secrets.yml (ruta fija del lab).
      # 'db_password' es top-level: se usa tal cual, sin prefijo.
      # ========================================================
      - name: "task_3 | Cargar variables del Vault (secrets.yml)"
        ansible.builtin.include_vars:
          file: "{{ playbook_dir }}/../files/secrets.yml"

      - name: "task_3 | Crear el directorio /opt/app"
        ansible.builtin.file:
          path: /opt/app
          state: directory
          mode: "0755"

      - name: "task_3 | Desplegar config.txt con db_password"
        ansible.builtin.copy:
          content: "{{ db_password }}"    # Desencriptado en memoria
          dest: /opt/app/config.txt

      # ========================================================
      # task_4 :: Usuarios 'web01' y 'web02' con LOOP Jinja2
      # El checker valida la existencia de los usuarios.
      # 'item' es el elemento actual de cada iteración.
      # ========================================================
      - name: "task_4 | Crear usuarios iterando dev_users"
        ansible.builtin.user:
          name: "{{ item }}"
          state: present
        loop: "{{ dev_users }}"

      # ========================================================
      # task_5 :: Cron de root → 'logger ExamenRHCE' cada 5 min
      # El checker valida: crontab -l -u root | grep 'logger ...'
      # ========================================================
      - name: "task_5 | Programar cron de root cada 5 minutos"
        ansible.builtin.cron:
          name: "ExamenRHCE Logger"   # Identificador interno del cron
          user: root                  # Dueño del crontab
          minute: "*/5"               # Cada 5 minutos (resto: '*')
          job: "logger ExamenRHCE"    # Comando literal que busca el checker
