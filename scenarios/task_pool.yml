# ========================
# Banco de Tareas (Aleatorio) - v2 "Task Pack #1"
# Reglas: cada tarea es AUTOCONTENIDA y CUALQUIER combinacion
# de tareas del pool es resoluble simultaneamente (sin choques
# de dispositivo: el LVM completo reutiliza vg_data@loop0).
# ============================
---
tasks:
  # ---------- EASY ----------
  - id: rand_pkg_httpd
    difficulty: easy
    description: "Instalar el servidor web httpd"
    checks:
      - type: package
        name: httpd
  - id: rand_svc_httpd
    difficulty: easy
    description: "Habilitar y arrancar el servicio httpd"
    checks:
      - type: service
        name: httpd
  - id: rand_user_deploy
    difficulty: easy
    description: "Crear el usuario 'deployer'"
    checks:
      - type: user
        name: deployer
  - id: rand_pkg_vsftpd
    difficulty: easy
    description: "Instalar el servidor FTP vsftpd"
    checks:
      - type: package
        name: vsftpd
  - id: rand_pkg_mariadb
    difficulty: easy
    description: "Instalar el servidor de base de datos mariadb-server"
    checks:
      - type: package
        name: mariadb-server
  - id: rand_user_webmaster
    difficulty: easy
    description: "Crear el usuario 'webmaster'"
    checks:
      - type: user
        name: webmaster
  - id: rand_group_devs
    difficulty: easy
    description: "Crear el grupo 'developers' con GID 3000"
    checks:
      - type: group
        name: developers
        path: "3000"
  # ---------- MEDIUM ----------
  - id: med_pkg_svc_chrony
    difficulty: medium
    description: "Instalar chrony y dejar el servicio chronyd activo"
    checks:
      - type: package
        name: chrony
      - type: service
        name: chronyd
  - id: med_pkg_svc_vsftpd
    difficulty: medium
    description: "Instalar vsftpd y dejar el servicio vsftpd activo"
    checks:
      - type: package
        name: vsftpd
      - type: service
        name: vsftpd
  - id: med_user_app
    difficulty: medium
    description: "Crear el usuario 'appuser' con UID 2500"
    checks:
      - type: user
        name: appuser
        path: "2500"
  # ---------- HARD ----------
  - id: hard_lvm_vg
    difficulty: hard
    description: "Crear un Volume Group 'vg_data' en el disco extra del nodo (node1:/dev/loop0, node2:/dev/loop2, node3:/dev/loop4)"
    checks:
      - type: lvm
        name: /dev/vg_data
  - id: hard_lvm_full
    difficulty: hard
    description: "Crear VG 'vg_data' en el disco extra del nodo (node1:/dev/loop0, node2:/dev/loop2, node3:/dev/loop4), LV 'lv_data' de 300MB, formatearlo ext4 y montarlo en /mnt/datos"
    checks:
      - type: lvm
        name: /dev/vg_data
      - type: lvm
        name: /dev/vg_data/lv_data
      - type: filesystem
        name: /dev/vg_data/lv_data
        path: ext4
      - type: mount
        name: /mnt/datos
        path: /dev/vg_data/lv_data
  - id: hard_cron
    difficulty: hard
    description: "Programar cron para ansible que ejecute '/usr/bin/echo backup'"
    checks:
      - type: cron
        name: "/usr/bin/echo backup"
        path: ansible
  - id: hard_cron_root
    difficulty: hard
    description: "Programar cron para root que ejecute '/usr/local/bin/backup.sh'"
    checks:
      - type: cron
        name: "/usr/local/bin/backup.sh"
        path: root

  # ================= TASK PACK #2 (v1.3.0) =================
  # SELinux fino: valida la REGLA fcontext a nivel de policy
  # (semanage), no el xattr del runtime. El alumno puede usar
  # community.general.sefcontext (instalada en la imagen) o
  # command/shell con semanage fcontext -a.
  - id: medium_fcontext_web
    difficulty: medium
    description: >
      SELinux: crea el directorio /web con un fichero index.html
      dentro. Añade la regla de contexto para que /web y todo su
      contenido queden etiquetados como httpd_sys_content_t,
      usando la spec /web(/.*)? y aplicando restorecon después
      para relabelar.
    checks:
      - task_id: medium_fcontext_web
        type: selinux_fcontext
        name: httpd_sys_content_t
        path: "/web(/.*)?"

  # Block/rescue/always: el pilar de "manejo de errores" que
  # cae siempre en el EX294. La corrección valida ESTADO en los
  # 3 nodos + estructura del playbook en el control.
  - id: hard_block_rescue
    difficulty: hard
    description: >
      Ansible avanzado: en el nodo control crea el playbook
      /home/ansible/block_rescue.yml que use block, rescue y
      always contra TODOS los nodos gestionados. El block
      intenta instalar el paquete paquete-fantasma (no existe
      y debe fallar). El rescue instala el paquete tree en su
      lugar. El always crea el fichero /tmp/block_ok en cada
      nodo con el modulo file en estado touch. Ejecuta el
      playbook con ansible-playbook antes de corregir.
    checks:
      - task_id: hard_block_rescue
        type: block_rescue
        name: tree
        path: /tmp/block_ok
