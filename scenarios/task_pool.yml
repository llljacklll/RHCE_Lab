# ============================================================
#  SCENARIOS/TASK_POOL.YML — Banco de tareas para exámenes
#  aleatorios (./lab.sh exam --random N)
# ------------------------------------------------------------
#  QUÉ ES: el menú del que el generador elige N tareas para
#  montar un examen distinto cada vez. NO es un examen en sí:
#  los exámenes fijos viven en scenarios/<dificultad>/exam_*.yml.
#
#  REGLAS DEL POOL (por diseño, inviolables):
#   - Cada tarea es AUTOCONTENIDA: no depende de que otra tarea
#     del pool haya corrido antes.
#   - CUALQUIER combinación de tareas es resoluble a la vez:
#     ninguna pisa el estado que otra necesita (usuarios,
#     paquetes, ficheros y VGs van siempre a nombres distintos).
#
#  DEVICE-MAPPER GLOBAL (por qué las tareas LVM son "raras"):
#   El registro de device-mapper es GLOBAL al kernel y los 3
#   nodos comparten kernel: un VG con nombre FIJO solo puede
#   activar sus LV en UN nodo (EBUSY en los otros dos). Por eso
#   las tareas LVM piden 'vg_<nodo>' y sus checks usan el
#   token __NODE__, que core/grade.sh expande al nombre de cada
#   nodo antes de llamar al checker.
#
#  ESQUEMA de cada tarea:
#   - id          → identificador único de la tarea
#   - difficulty  → easy | medium | hard (peso del generador)
#   - description → el enunciado que ve el alumno
#   - checks      → type/name/path con el contrato de
#                   core/checkers/ (uno o varios por tarea)
# ============================================================
---
tasks:
  # ---------- EASY ----------
  - id: rand_pkg_httpd
    difficulty: easy
    description: "Instalar el servidor web httpd"
    checks:
      - type: package
        name: httpd
  - id: rand_svc_httpd
    difficulty: easy
    description: "Habilitar y arrancar el servicio httpd"
    checks:
      - type: service
        name: httpd
  - id: rand_user_deploy
    difficulty: easy
    description: "Crear el usuario 'deployer'"
    checks:
      - type: user
        name: deployer
  - id: rand_pkg_vsftpd
    difficulty: easy
    description: "Instalar el servidor FTP vsftpd"
    checks:
      - type: package
        name: vsftpd
  - id: rand_pkg_mariadb
    difficulty: easy
    description: "Instalar el servidor de base de datos mariadb-server"
    checks:
      - type: package
        name: mariadb-server
  - id: rand_user_webmaster
    difficulty: easy
    description: "Crear el usuario 'webmaster'"
    checks:
      - type: user
        name: webmaster
  - id: rand_group_devs
    difficulty: easy
    description: "Crear el grupo 'developers' con GID 3000"
    checks:
      - type: group
        name: developers
        path: "3000"
  # ---------- MEDIUM ----------
  - id: med_pkg_svc_chrony
    difficulty: medium
    description: "Instalar chrony y dejar el servicio chronyd activo"
    checks:
      - type: package
        name: chrony
      - type: service
        name: chronyd
  - id: med_pkg_svc_vsftpd
    difficulty: medium
    description: "Instalar vsftpd y dejar el servicio vsftpd activo"
    checks:
      - type: package
        name: vsftpd
      - type: service
        name: vsftpd
  - id: med_user_app
    difficulty: medium
    description: "Crear el usuario 'appuser' con UID 2500"
    checks:
      - type: user
        name: appuser
        path: "2500"
  # ---------- HARD ----------
  - id: hard_lvm_vg
    difficulty: hard
    description: "Crear un Volume Group 'vg_' + nombre del nodo (node1 -> vg_node1, node2 -> vg_node2, node3 -> vg_node3) en el disco extra del nodo (node1:/dev/loop0, node2:/dev/loop2, node3:/dev/loop4)"
    checks:
      - type: lvm
        name: /dev/vg___NODE__
  - id: hard_lvm_full
    difficulty: hard
    description: "Crear VG 'vg_' + nombre del nodo (node1 -> vg_node1, node2 -> vg_node2, node3 -> vg_node3) en el disco extra del nodo (node1:/dev/loop0, node2:/dev/loop2, node3:/dev/loop4), LV 'lv_data' de 300MB, formatearlo ext4 y montarlo en /mnt/datos"
    checks:
      - type: lvm
        name: /dev/vg___NODE__
      - type: lvm
        name: /dev/vg___NODE__/lv_data
      - type: filesystem
        name: /dev/vg___NODE__/lv_data
        path: ext4
      - type: mount
        name: /mnt/datos
        path: /dev/vg___NODE__/lv_data
  - id: hard_cron
    difficulty: hard
    description: "Programar cron para ansible que ejecute '/usr/bin/echo backup'"
    checks:
      - type: cron
        name: "/usr/bin/echo backup"
        path: ansible
  - id: hard_cron_root
    difficulty: hard
    description: "Programar cron para root que ejecute '/usr/local/bin/backup.sh'"
    checks:
      - type: cron
        name: "/usr/local/bin/backup.sh"
        path: root

  # ================= TASK PACK #2 =================
  # SELinux fino: valida la REGLA fcontext a nivel de policy
  # (semanage), no el xattr del runtime. El alumno puede usar
  # community.general.sefcontext (instalada en la imagen) o
  # command/shell con semanage fcontext -a.
  - id: medium_fcontext_web
    difficulty: medium
    description: >-
      SELinux: crea el directorio /web con un fichero index.html
      dentro. Añade la regla de contexto para que /web y todo su
      contenido queden etiquetados como httpd_sys_content_t,
      usando la spec /web(/.*)? y aplicando restorecon después
      para relabelar.
    checks:
      - task_id: medium_fcontext_web
        type: selinux_fcontext
        name: httpd_sys_content_t
        path: "/web(/.*)?"

  # Block/rescue/always: el pilar de "manejo de errores" que
  # cae siempre en el EX294. La corrección valida ESTADO en los
  # 3 nodos + estructura del playbook en el control.
  - id: hard_block_rescue
    difficulty: hard
    description: >-
      Ansible avanzado: en el nodo control crea el playbook
      /home/ansible/block_rescue.yml que use block, rescue y
      always contra TODOS los nodos gestionados. El block
      intenta instalar el paquete paquete-fantasma (no existe
      y debe fallar). El rescue instala el paquete tree en su
      lugar. El always crea el fichero /tmp/block_ok en cada
      nodo con el modulo file en estado touch. Ejecuta el
      playbook con ansible-playbook antes de corregir.
    checks:
      - task_id: hard_block_rescue
        type: block_rescue
        name: tree
        path: /tmp/block_ok

  # ================= TASK PACK #3 =================
  # Volumen y variedad del banco: mas piezas basicas (paquete/grupo),
  # un combo paquete+servicio nuevo, un cron adicional y un
  # selinux_fcontext multiparte (dos reglas en una tarea). Todo con
  # checkers existentes: package, group, user, service, cron y
  # selinux_fcontext. Nombres/GIDs/UIDs/rutas nuevos para no pisar
  # ninguna tarea previa (regla de combinabilidad del pool).
  - id: rand_pkg_nfsutils
    difficulty: easy
    description: "Instalar los utilitarios de cliente NFS (nfs-utils)"
    checks:
      - type: package
        name: nfs-utils
  - id: rand_group_qa
    difficulty: easy
    description: "Crear el grupo 'qa' con GID 3100"
    checks:
      - type: group
        name: qa
        path: "3100"
  - id: med_user_dbadmin
    difficulty: medium
    description: "Crear el usuario 'dbadmin' con UID 2700"
    checks:
      - type: user
        name: dbadmin
        path: "2700"
  - id: med_pkg_svc_samba
    difficulty: medium
    description: "Instalar samba y dejar el servicio smb activo"
    checks:
      - type: package
        name: samba
      - type: service
        name: smb
  - id: hard_cron_purge
    difficulty: hard
    description: "Programar cron para root que ejecute '/usr/local/bin/purge.sh'"
    checks:
      - type: cron
        name: "/usr/local/bin/purge.sh"
        path: root
  - id: hard_fcontext_multi
    difficulty: hard
    description: >-
      SELinux: crea los directorios /srv/tools y /srv/incoming con un
      fichero dentro de cada uno. Anade las reglas de contexto para que
      /srv/tools y su contenido queden etiquetados como public_content_t
      (spec /srv/tools(/.*)?) y /srv/incoming y su contenido como
      public_content_rw_t (spec /srv/incoming(/.*)?), aplicando
      restorecon despues en ambos arboles.
    checks:
      - task_id: hard_fcontext_multi
        type: selinux_fcontext
        name: public_content_t
        path: "/srv/tools(/.*)?"
      - task_id: hard_fcontext_multi
        type: selinux_fcontext
        name: public_content_rw_t
        path: "/srv/incoming(/.*)?"

  # ================= TASK PACK #4 =================
  # Estreno en el pool de los checkers file y permissions:
  # existian en core/checkers/ desde el principio pero ninguna
  # tarea del banco los llamaba (cobertura 10/12 tipos). Combo
  # paquete+servicio nuevo y nombres/GIDs/rutas nuevos para no
  # pisar ninguna tarea previa (regla de combinabilidad del pool).
  # Contenidos y modos literales en el enunciado: el alumno ve
  # exactamente lo que el checker exige.
  - id: rand_pkg_wget
    difficulty: easy
    description: "Instalar la utilidad de descargas wget"
    checks:
      - type: package
        name: wget
  - id: rand_group_ops
    difficulty: easy
    description: "Crear el grupo 'ops' con GID 3200"
    checks:
      - type: group
        name: ops
        path: "3200"
  - id: med_pkg_svc_postfix
    difficulty: medium
    description: "Instalar postfix y dejar el servicio postfix activo"
    checks:
      - type: package
        name: postfix
      - type: service
        name: postfix
  - id: med_file_motd
    difficulty: medium
    description: "En cada nodo, dejar escrito /etc/motd con el aviso 'Acceso monitorizado' (el fichero debe contener ese texto)"
    checks:
      - type: file
        name: "Acceso monitorizado"
        path: /etc/motd
  - id: hard_file_precheck
    difficulty: hard
    description: "Despliega en cada nodo el script /usr/local/bin/precheck.sh que empiece por la linea '#!/bin/bash' y deja sus permisos en 750"
    checks:
      - type: file
        name: '#!/bin/bash'
        path: /usr/local/bin/precheck.sh
      - type: permissions
        name: "750"
        path: /usr/local/bin/precheck.sh
  - id: hard_perms_setgid
    difficulty: hard
    description: "Crea el grupo 'proj' y el directorio /srv/proyectos propiedad del grupo proj con permisos 2770 (setgid)"
    checks:
      - type: permissions
        name: "2770"
        path: /srv/proyectos

  # ---------- MEDIUM: huecos del examen real (intel EX294, LOTE 40) ----------
  - id: med_repo_docker
    difficulty: medium
    description: "Configura en todos los nodos el repositorio 'docker-ce-stable' apuntando al repo estable de Docker para EL10 (centos/10), con su gpgkey y habilitado"
    checks:
      - type: repo
        name: docker-ce-stable
  - id: med_firewall_port
    difficulty: medium
    description: "Abre de forma PERMANENTE el puerto 8081/tcp en la zona public de todos los nodos"
    checks:
      - type: firewall
        name: "8081/tcp"
        path: public
  - id: med_symlink_web
    difficulty: medium
    description: "Crea en todos los nodos el enlace simbolico /opt/web que apunte a /srv/webapp"
    checks:
      - type: symlink
        name: /srv/webapp
        path: /opt/web
  - id: med_galaxy_reqs
    difficulty: medium
    description: "En control: crea /home/ansible/requirements.yml que declare la coleccion community.crypto e instalala con ansible-galaxy"
    checks:
      - type: galaxy
        name: "collection:community.crypto"
  - id: med_chrony_conf
    difficulty: medium
    description: "Instala chrony en todos los nodos, configura el servidor NTP pool.ntp.org en /etc/chrony.conf y deja chronyd activo"
    checks:
      - type: package
        name: chrony
      - type: timesync
        name: pool.ntp.org
      - type: service
        name: chronyd
  - id: med_vault_create
    difficulty: medium
    description: "En control: crea el vault /home/ansible/vault_app.yml con la variable app_secret=VaultEx294, cifrado con la contraseña del laboratorio"
    checks:
      - type: vault
        name: app_secret
        path: /home/ansible/vault_app.yml
  - id: hard_vault_rekey
    difficulty: hard
    description: "En control: prepara el vault /home/ansible/vault_ops.yml (variable ops_secret=RekeyEx294) cifrandolo con la contraseña vieja de /home/ansible/.pass_old y hazle rekey a la contraseña del laboratorio"
    checks:
      - type: vault
        name: ops_secret
        path: /home/ansible/vault_ops.yml
  - id: hard_timesync_role
    difficulty: hard
    description: "En control: instala la coleccion redhat.rhel_system_roles desde galaxy y aplica su rol timesync en los nodos para sincronizar contra pool.ntp.org"
    checks:
      - type: galaxy
        name: "collection:redhat.rhel_system_roles"
      - type: timesync
        name: pool.ntp.org
  - id: hard_haproxy_bal
    difficulty: hard
    description: "Instala haproxy en todos los nodos, configuralo para balancear por round-robin en el puerto 8080 hacia el httpd de node1, node2 y node3 (puerto 80) y deja el servicio activo"
    checks:
      - type: package
        name: haproxy
      - type: file
        name: "node1:80"
        path: /etc/haproxy/haproxy.cfg
      - type: service
        name: haproxy
