# ============================================================
#  SCENARIOS/HARD/EXAM_003.YML — Examen fijo (HARD):
#  "Simulacro Oficial EX294" (LVM + Ansible Vault + Jinja2 + Cron)
# ------------------------------------------------------------
#  QUÉ ES: el examen estrella del laboratorio: reproduce el
#  elenco típico del EX294 real — storage LVM sobre el disco
#  extra del nodo, secretos con Ansible Vault, bucles Jinja2
#  y entradas de cron.
#
#  REQUISITOS PREVIOS:
#    - Vault creado:  ./scripts/create_vault.sh
#    - Ejecutar con:  ./lab.sh run --vault exam_003.yml
#
#  REGLA DE ORO DEL PARSER (core/grade.sh):
#    Comentarios SOLO en línea completa, nunca al final de una
#    línea de datos (el parser leería el resto de la línea).
#
#  HISTORIAL DE LA MIGRACIÓN LVM:
#    Este examen nació (d7a57b0) antes de que el lab adoptara
#    la arquitectura por nodo (465b60c: device-mapper es GLOBAL
#    al kernel compartido y dos VG con el mismo nombre chocan
#    en /dev/mapper; además el filtro LVM de cada nodo esconde
#    los loops de los demás: /dev/loop0 solo es visible en
#    node1). Sus tareas LVM aún pedían un 'vg_exam' idéntico
#    en los tres nodos sobre /dev/loop0: inaprobable por
#    construcción. Migrado al patrón del pool: VG vg_<nodo>
#    sobre el disco extra de cada nodo + token __NODE__.
# ============================================================

---
id: exam_003
difficulty: hard
title: "EX294 Simulacro Oficial (LVM, Vault, Jinja2, Cron)"
time_limit: 45

tasks:

  # LVM: VG por nodo sobre el disco extra raw (sin particiones:
  # los loop devices de Docker no soportan /dev/loop0p1)
  - id: task_1
    description: "Crear un Volume Group llamado 'vg_<nodo>' sobre el disco extra de cada nodo (node1:/dev/loop0, node2:/dev/loop2, node3:/dev/loop4); ejemplo: en node1 debe llamarse vg_node1"

  # LVM: Logical Volume + filesystem XFS dentro del VG del nodo
  - id: task_2
    description: "Crear un Logical Volume de 500MB llamado 'lv_datos' dentro del VG del nodo ('vg_<nodo>') y formatearlo en XFS"

  # Vault: la contraseña del vault se entrega en el enunciado,
  # igual que en el EX294 real
  - id: task_3
    description: "Crear un archivo /opt/app/config.txt usando la variable 'db_password' encriptada en ansible/files/secrets.yml (contraseña del vault: RhceLab2026)"

  # Jinja2: bucle sobre una lista de usuarios
  - id: task_4
    description: "Crear los usuarios 'web01' y 'web02' iterando una lista en Jinja2"

  # Cron: entrada en el crontab de root
  - id: task_5
    description: "Programar un cron para root que ejecute 'logger ExamenRHCE' cada 5 minutos"

checks:

  # task_1 → VG por nodo (el token __NODE__ lo expande _run_check
  # a vg_node1, vg_node2, vg_node3)
  - task_id: task_1
    type: lvm
    name: /dev/vg___NODE__

  # task_2 → LV dentro del VG del nodo
  - task_id: task_2
    type: lvm
    name: /dev/vg___NODE__/lv_datos

  # task_3 → el fichero debe contener el valor secreto
  - task_id: task_3
    type: file
    path: /opt/app/config.txt
    contains: "SecretPassword123"

  # task_4 → el checker valida al menos la creación de web01
  - task_id: task_4
    type: user
    name: web01

  # task_5 → grep literal en el crontab de root
  - task_id: task_5
    type: cron
    name: "logger ExamenRHCE"
    path: root
