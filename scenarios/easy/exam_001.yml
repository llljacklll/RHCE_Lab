# ============================================================
#  SCENARIOS/EASY/EXAM_001.YML — Examen fijo (EASY):
#  "Apache Básico y Usuarios"
# ------------------------------------------------------------
#  QUÉ EVALÚA: el mínimo vital del EX294 — instalar un paquete
#  (package), crear usuarios (user) y dejar un servicio
#  habilitado y arrancado (service), todo en los nodos.
#
#  Formato del fichero:
#   - id / difficulty / title / time_limit → metadatos que lee
#     lab.sh (time_limit en minutos).
#   - tasks  → lo que ve el alumno en pantalla
#   - checks → lo que ejecuta el motor de corrección
#              (type → core/checkers/check_<type>.sh);
#              cada check referencia su tarea por task_id.
# ============================================================

---
id: exam_001
difficulty: easy
title: "Apache Básico y Usuarios"
time_limit: 15

tasks:
  - id: task_1
    description: "Instalar el servidor web httpd en todos los nodos"
  - id: task_2
    description: "Crear el usuario 'webadmin' en todos los nodos"
  - id: task_3
    description: "Habilitar y arrancar el servicio httpd"

checks:
  - task_id: task_1
    type: package
    name: httpd
  - task_id: task_2
    type: user
    name: webadmin
  - task_id: task_3
    type: service
    name: httpd
