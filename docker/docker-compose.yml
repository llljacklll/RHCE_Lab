# ==========================================
# Red Fija y Contenedores Privilegiados
# ==========================================
services:
  control:
    build: { context: ., dockerfile: Dockerfile }
    container_name: control; hostname: control
    privileged: true; stop_signal: SIGRTMIN+3; cgroup: host
    volumes: [ ../ansible:/opt/ansible, /sys/fs/cgroup:/sys/fs/cgroup:rw ]
    networks: { rhce-network: { ipv4_address: 172.20.0.10 } }
    devices: [ /dev/loop-control ]
    environment: [ ANSIBLE_CONFIG=/etc/ansible/ansible.cfg, ANSIBLE_ROLES_PATH=/opt/ansible/roles, ANSIBLE_HOST_KEY_CHECKING=False, ANSIBLE_TIMEOUT=30 ]
    tty: true; stdin_open: true
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN, MKNOD ]

  node1:
    build: { context: ., dockerfile: Dockerfile }
    container_name: node1; hostname: node1
    privileged: true; stop_signal: SIGRTMIN+3; cgroup: host
    volumes: [ /sys/fs/cgroup:/sys/fs/cgroup:rw ]
    networks: { rhce-network: { ipv4_address: 172.20.0.11 } }
    devices: [ /dev/loop-control ]
    tty: true; stdin_open: true
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN, MKNOD ]

  node2:
    build: { context: ., dockerfile: Dockerfile }
    container_name: node2; hostname: node2
    privileged: true; stop_signal: SIGRTMIN+3; cgroup: host
    volumes: [ /sys/fs/cgroup:/sys/fs/cgroup:rw ]
    networks: { rhce-network: { ipv4_address: 172.20.0.12 } }
    devices: [ /dev/loop-control ]
    tty: true; stdin_open: true
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN, MKNOD ]

  node3:
    build: { context: ., dockerfile: Dockerfile }
    container_name: node3; hostname: node3
    privileged: true; stop_signal: SIGRTMIN+3; cgroup: host
    volumes: [ /sys/fs/cgroup:/sys/fs/cgroup:rw ]
    networks: { rhce-network: { ipv4_address: 172.20.0.13 } }
    devices: [ /
    tty: true; stdin_open: true
    cap_add: [ NET_AD

