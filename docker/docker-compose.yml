# ==========================================
#  RHCE LAB - Topología del laboratorio:
#  control + node1..3 sobre una red bridge FIJA
#  (172.20.0.0/24, IPs .10-.13). La topología es
#  parte del enunciado: no puede cambiar entre
#  arranques.
#
#  ANCLA YAML x-node-base: la base común (build,
#  privileged, SIGRTMIN+3, cgroup:host, loop-control,
#  capabilities) se declara UNA vez y cada servicio
#  la fusiona con '<<: *node-base' (DRY: un solo
#  sitio que tocar si cambia la base).
#
#  POR QUÉ tan privilegiados: systemd como PID 1
#  en un contenedor necesita privilegios reales
#  (cgroup:host) y una señal de apagado limpia
#  (SIGRTMIN+3, la que docker espera de un init).
#  NET_ADMIN/NET_RAW: firewalld offline.
#  SYS_ADMIN/MKNOD: cada nodo crea/adjunta SUS
#  /dev/loopN (discos LVM fake).
#
#  Solo 'control' monta el repo (../ansible como
#  /opt/ansible): es el nodo de gestión; node1..3
#  reciben los cambios vía playbooks, como en la
#  arquitectura real de gestión.
# ==========================================

x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile
  privileged: true
  stop_signal: SIGRTMIN+3
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  devices:
    - /dev/loop-control
  tty: true
  stdin_open: true
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
    - MKNOD

services:
  control:
    <<: *node-base
    container_name: control
    hostname: control
    volumes:
      - ../ansible:/opt/ansible
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      rhce-network:
        ipv4_address: 172.20.0.10
    environment:
      - ANSIBLE_CONFIG=/etc/ansible/ansible.cfg
      - ANSIBLE_ROLES_PATH=/opt/ansible/roles
      - ANSIBLE_HOST_KEY_CHECKING=False
      - ANSIBLE_TIMEOUT=30

  node1:
    <<: *node-base
    container_name: node1
    hostname: node1
    networks:
      rhce-network:
        ipv4_address: 172.20.0.11

  node2:
    <<: *node-base
    container_name: node2
    hostname: node2
    networks:
      rhce-network:
        ipv4_address: 172.20.0.12

  node3:
    <<: *node-base
    container_name: node3
    hostname: node3
    networks:
      rhce-network:
        ipv4_address: 172.20.0.13

networks:
  rhce-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
