# ==========================================
#  RHCE LAB - Red fija y contenedores privilegiados
#  (reconstruido: expandido y con ancla YAML)
# ==========================================

x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile
  privileged: true
  stop_signal: SIGRTMIN+3
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  devices:
    - /dev/loop-control
  tty: true
  stdin_open: true
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
    - MKNOD

services:
  control:
    <<: *node-base
    container_name: control
    hostname: control
    volumes:
      - ../ansible:/opt/ansible
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      rhce-network:
        ipv4_address: 172.20.0.10
    environment:
      - ANSIBLE_CONFIG=/etc/ansible/ansible.cfg
      - ANSIBLE_ROLES_PATH=/opt/ansible/roles
      - ANSIBLE_HOST_KEY_CHECKING=False
      - ANSIBLE_TIMEOUT=30

  node1:
    <<: *node-base
    container_name: node1
    hostname: node1
    networks:
      rhce-network:
        ipv4_address: 172.20.0.11

  node2:
    <<: *node-base
    container_name: node2
    hostname: node2
    networks:
      rhce-network:
        ipv4_address: 172.20.0.12

  node3:
    <<: *node-base
    container_name: node3
    hostname: node3
    networks:
      rhce-network:
        ipv4_address: 172.20.0.13

networks:
  rhce-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
