# ============================================================
#  DOCKER/ANSIBLE.CFG — Ansible por defecto DENTRO de los nodos
# ------------------------------------------------------------
#  La imagen lo instala en /etc/ansible/ansible.cfg (ubicación
#  por defecto de Ansible) y el compose de 'control' además lo
#  señala con ANSIBLE_CONFIG: manda para cualquier ansible que
#  corra en los 4 contenedores.
#
#  [defaults]
#    roles_path = /opt/ansible/roles -> aquí cuelgan los roles
#      del laboratorio (bind mount del repo; solo en control).
#    host_key_checking = False -> primera conexión sin aceptar
#      fingerprints a mano: los nodos son desechables, no hay
#      que fiarse de su identidad más allá del lab.
#    timeout = 30 -> SSH holgado para arranques fríos.
#    interpreter_python = auto_silent -> autodetecta python3
#      sin ensuciar la salida con warnings de discovery.
#  [privilege_escalation]
#    become = True por defecto (sudo -> root): los playbooks del
#    lab no necesitan 'become: yes' en cada tarea; el usuario
#    'ansible' de la imagen ya es wheel + NOPASSWD.
# ============================================================
[defaults]
roles_path = /opt/ansible/roles
host_key_checking = False
timeout = 30
interpreter_python = auto_silent
[privilege_escalation]
become = True
become_method = sudo
become_user = root
