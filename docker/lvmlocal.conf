# ==========================================
#  RHCE LAB - Override LVM local (anti-udev)
#  lvm2 lee este fichero DESPUES de lvm.conf.
#  En el contenedor no hay udev: sin esto
#  pvcreate/vgcreate fallan.
#  FILTRO: solo /dev/loop* (los discos fake);
#  esconde el nvme REAL del host MV para que
#  nadie toque el VG del host desde el lab.
# ==========================================
devices {
    obtain_device_list_from_udev = 0
    use_devicesfile = 0
    filter = [ "a|^/dev/loop[0-9]+$|", "r|.*|" ]
}

global {
    use_lvmetad = 0
}

activation {
    udev_sync = 0
    udev_rules = 0
}
