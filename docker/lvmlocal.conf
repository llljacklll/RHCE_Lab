# ==========================================
#  RHCE LAB - Override LVM local (anti-udev)
#  lvm2 lee este fichero DESPUES de lvm.conf:
#  estos ajustes pisan el default sin tocar
#  la config de distro. En el contenedor no
#  hay udev: sin esto pvcreate/vgcreate fallan.
# ==========================================
devices {
    obtain_device_list_from_udev = 0
    use_devicesfile = 0
}

global {
    use_lvmetad = 0
}

activation {
    udev_sync = 0
    udev_rules = 0
}
