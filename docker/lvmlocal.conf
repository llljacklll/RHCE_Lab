# ============================================================
#  DOCKER/LVMLOCAL.CONF — Override LVM para el contenedor
# ------------------------------------------------------------
#  lvm2 lee este fichero DESPUÉS de /etc/lvm/lvm.conf: es el
#  sitio canónico para overrides locales sin tocar el conf de
#  la distro.
#
#  POR QUÉ: el LVM moderno delega en udev el descubrimiento de
#  dispositivos y la sincronización de la activación; en el
#  contenedor NO hay udev y pvcreate/vgcreate fallan (o se
#  cuelgan) sin este apagado explícito.
#
#  FILTRO (la parte de seguridad): ACEPTA solo /dev/loopN (los
#  discos fake) y RECHAZA todo lo demás. El nvme REAL de la
#  máquina virtual queda invisible: imposible tocarse el VG del
#  host desde un playbook del lab (lo verifica el smoke 4/5).
#
#  Bloques: devices (sin udev, sin devices-file, solo loops),
#  global (lvmetad fuera, obsoleto aquí) y activation
#  (udev_sync/udev_rules a 0, coherente con lo anterior).
# ============================================================
devices {
    obtain_device_list_from_udev = 0
    use_devicesfile = 0
    filter = [ "a|^/dev/loop[0-9]+$|", "r|.*|" ]
}

global {
    use_lvmetad = 0
}

activation {
    udev_sync = 0
    udev_rules = 0
}
