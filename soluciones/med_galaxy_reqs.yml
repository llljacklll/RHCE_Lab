# ============================================================================
#  SOLUCION MODELO -- med_galaxy_reqs               [dificultad: medium]
# ----------------------------------------------------------------------------
#  TAREA: en control, crear /home/ansible/requirements.yml declarando
#  la coleccion community.crypto e instalarla con ansible-galaxy.
#
#  POR QUE IMPORTA (intel #4): en un intento real pidieron modulos de
#  redhat.rhel_system_roles SIN regalar el .tar.gz: habia que tirar
#  de 'ansible-galaxy collection install -r requirements.yml' de
#  memoria. Aqui se practica el flujo completo con una coleccion
#  ligera y sin dependencias.
#
#  DETALLES FINOS:
#   - hosts: localhost + connection: local: el entregable vive en el
#     PROPIO control; no se toca ningun nodo.
#   - Sin become (ahora EXPLICITO): instala en
#     /home/ansible/.ansible/collections (el user site de galaxy).
#     El checker lista tambien /root/.ansible y no discrimina.
#   - FIX v1.12.1 -- environment: PATH en la tarea: sudo resetea el
#     PATH a secure_path de RHEL (sin /usr/local/bin, donde pip deja
#     los CLI de ansible-core en EL10) y el modulo command moria con
#     [Errno 2] No such file or directory: b'ansible-galaxy'. El
#     environment del task se renderiza DETRAS del sudo: el binario
#     se encuentra venga como se venga a ejecutar la solucion.
#   - El install es idempotente: re-ejecutar dice "Nothing to do".
#
#  VALIDACION: core/checkers/check_galaxy.sh -- 'collection list' en
#  control contiene community.crypto.
# ===========================================================================
- name: Coleccion community.crypto en control
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Declarar requirements.yml
      ansible.builtin.copy:
        dest: /home/ansible/requirements.yml
        mode: "0644"
        content: |
          ---
          collections:
            - name: community.crypto

    - name: Instalar la coleccion declarada
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r /home/ansible/requirements.yml
      environment:
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
      changed_when: false
