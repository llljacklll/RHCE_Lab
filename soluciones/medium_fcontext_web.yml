# ===========================================================================
#  SOLUCION MODELO -- medium_fcontext_web    [dificultad: medium]
# ---------------------------------------------------------------------------
#  TAREA: crea /web con un index.html de prueba, registra la regla
#  fcontext '/web(/.*)?' -> httpd_sys_content_t y aplica restorecon.
#
#  POR QUE semanage POR command Y NO community.general.sefcontext:
#    - sefcontext exige SELinux HABILITADO en el kernel: en los
#      contenedores del lab falla con "SELinux is disabled on this
#      host." (getenforce -> Disabled).
#    - semanage opera sobre la POLICY STORE (/etc/selinux), que
#      dentro del contenedor SI es real y persistente aunque el
#      kernel no cargue SELinux: exactamente lo que el checker
#      valida (semanage fcontext -l / matchpathcon).
#
#  CONCEPTO SELINUX CLAVE (por que el enunciado pide DOS pasos):
#    - La regla fcontext NO es retroactiva: los ficheros YA creados
#      mantienen su contexto hasta un relabel. restorecon -R /web
#      aplica la regla al contenido EXISTENTE.
#    - En un host con SELinux activo restorecon ejecuta; en el
#      contenedor (Disabled) se salta con un when sobre el hecho
#      ansible_facts['selinux']['status'] (no hay kernel que
#      relabele) y el checker valida la policy, no los xattr.
#    - '/web(/.*)?' es la regex de semanage: casa con /web y con
#      todo su contenido, recursivamente.
#
#  DETALLES FINOS:
#    - Idempotencia: si la regla ya existe, semanage -a se queja por
#      stderr con "already defined"; failed_when lo tolera y
#      changed_when (rc == 0) evita 'changed' fantasma al re-ejecutar.
#    - mode SIEMPRE entre comillas: sin ellas YAML 1.1 lee 0755
#      como octal.
#
#  VALIDACION: core/checkers/check_selinux_fcontext.sh -- regla
#  persistente presente en la policy en cada nodo (rama 1a:
#  semanage fcontext -l; respaldo 1b: matchpathcon).
# ===========================================================================
- name: SELinux fcontext para /web
  hosts: all
  become: true

  tasks:
    - name: Directorio /web
      ansible.builtin.file:
        path: /web
        state: directory
        mode: "0755"

    - name: index.html de prueba
      ansible.builtin.copy:
        dest: /web/index.html
        content: "hola"
        mode: "0644"

    - name: Regla fcontext /web -> httpd_sys_content_t
      ansible.builtin.command:
        cmd: semanage fcontext -a -t httpd_sys_content_t '/web(/.*)?'
      register: regla_web
      changed_when: regla_web.rc == 0
      failed_when: >-
        regla_web.rc != 0 and 'already'
        not in (regla_web.stderr ~ regla_web.stdout)

    - name: Relabel con restorecon (solo con SELinux activo)
      ansible.builtin.command:
        cmd: restorecon -R /web
      changed_when: false
      when: ansible_facts['selinux']['status'] | lower == 'enabled'
