# ============================================================
#  .GITHUB/WORKFLOWS/CI.YML — Integración continua del repositorio
# ------------------------------------------------------------
#  QUÉ ES: la batería que GitHub Actions corre en cada push a
#  'main', en cada pull_request y bajo demanda (workflow_dispatch).
#  6 puertas, todas de solo lectura: aquí no se ejecuta nada del
#  laboratorio, solo se valida el estado del repo.
#
#  PUERTA 1/6 — bash -n sobre TODOS los .sh (find -print0):
#    sintaxis sin ejecutar. Cubre también directorios ocultos
#    porque find sí baja a los que empiezan por punto (glob no).
#  PUERTA 2/6 — PyYAML sobre todos los .yml/.yaml:
#    parseo con safe_load_all; los vault cifrados se saltan
#    (detecta 'ANSIBLE_VAULT' en los primeros 200 bytes).
#    NOTA C: glob(**) de Python NO baja a directorios ocultos,
#    así que los YAML de .github/ quedaban fuera de SU propia
#    batería (un workflow roto pasaba el CI sin acusarse). El
#    glob explícito de esta puerta lo corrige.
#  PUERTA 3/6 — heredocs de Python embebidos en los .sh:
#    detecta 'pythonN - << DELIM', sustituye $(cmd), ${VAR} y
#    $VAR por '3' (para que compile) y compila el cuerpo con
#    compile(). LIMITACIÓN CONOCIDA: exige el terminador en la
#    columna 0; un heredoc indentado dentro de un if/for no
#    casa y queda fuera del radar (ni se audita ni falla), la
#    misma familia de hueco que ui/*.sh en scripts/audit_py.sh.
#  PUERTA 4/6 — integridad checks <-> checkers: cada 'type' de
#    scenarios/**/*.yml (tanto el 'checks' de cabecera como los
#    'tasks[].checks') debe tener su core/checkers/check_<type>.sh.
#  PUERTA 5/6 — anti-huérfanos (core/lint_pool.sh): el banco
#    debe quedar alineado 1:1 por task_id entre
#    scenarios/task_pool.yml, soluciones/*.yml y la tabla del
#    README de soluciones; tarea sin solución, solución
#    fantasma o fila ausente/sobrante rompen el push.

#  PUERTA 6/6 — Banco (core/valida_banco.sh): formato, esquema y
#    cruces del banco de tareas (capas A/B/C; activa desde v1.13.0).
#
#  TRAMPA YAML 1.1: el 'on:' sin comillas de arriba es booleano
#  True para PyYAML (safe_load devuelve {True: {...}, 'jobs': ...}).
#  GitHub Actions lo parsea correctamente; la trampa solo muerde
#  a quien valide el fichero a mano buscando dict['on'].
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: "1/6 bash -n: sintaxis de todos los .sh"
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=${f}::bash -n FALLO"; rc=1; }
          done < <(find . -name '*.sh' -print0)
          if [ "$rc" -eq 0 ]; then echo "bash -n: todos los .sh OK"; else exit 1; fi

      - name: "2/6 YAML: todos los .yml parsean"
        run: |
          python3 - << 'PYCI'
          import glob, sys, yaml
          bad = 0
          files = sorted(set(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True) + glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')))
          for f in files:
              try:
                  if 'ANSIBLE_VAULT' in open(f, encoding='utf-8', errors='ignore').read(200):
                      print('[SKIP] vault cifrado:', f); continue
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
                  print('[OK ]', f)
              except Exception as e:
                  print('[FAIL]', f, '->', e); bad = 1
          print('YAML:', 'OK' if not bad else 'ERRORES')
          sys.exit(bad)
          PYCI

      - name: "3/6 Python embebido: heredocs de python compilan"
        run: |
          python3 - << 'PYCI'
          import glob, re, sys
          bad = 0
          pat = re.compile(r"(?sm)\bpython[0-9.]*\s+(?:-[A-Za-z]*\s+)?<<\s*-?\s*(['\"]?)(\w+)\1[^\n]*\n(.*?)^\2$")
          for f in sorted(glob.glob('**/*.sh', recursive=True)):
              src = open(f, encoding='utf-8', errors='ignore').read()
              for i, m in enumerate(pat.finditer(src)):
                  body = m.group(3)
                  body = re.sub(r"\$\([^)]*\)", "3", body)
                  body = re.sub(r"\$\{?[A-Za-z_][A-Za-z0-9_]*\}?", "3", body)
                  try:
                      compile(body, "%s:<heredoc %d>" % (f, i), "exec")
                      print('[OK ]', f, 'heredoc', i)
                  except SyntaxError as e:
                      print('[FAIL]', f, 'heredoc %d' % i, '->', e); bad = 1
          print('Heredocs:', 'OK' if not bad else 'ERRORES')
          sys.exit(bad)
          PYCI

      - name: "4/6 Checkers: todo tipo de check tiene su plugin"
        run: |
          python3 - << 'PYCI'
          import glob, os, sys, yaml
          bad = 0
          tipos = {os.path.basename(p)[6:-3] for p in glob.glob('core/checkers/check_*.sh')}
          for f in sorted(glob.glob('scenarios/**/*.yml', recursive=True)):
              try:
                  data = yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('[FAIL]', f, '->', e); bad = 1; continue
              if not isinstance(data, dict):
                  continue
              checks = list(data.get('checks', []))
              for t in data.get('tasks', []):
                  checks += t.get('checks', [])
              for c in checks:
                  if not isinstance(c, dict) or c.get('type') not in tipos:
                      print('[FAIL]', f, '-> check con tipo desconocido:', c)
                      bad = 1
          print('Tipos disponibles:', ', '.join(sorted(tipos)))
          print('Checkers:', 'OK' if not bad else 'ERRORES')
          sys.exit(bad)
          PYCI

      - name: "5/6 Anti-huerfanos: pool <-> soluciones <-> README"
        run: bash core/lint_pool.sh
      - name: "6/6 Banco: formato, esquema y cruces (valida_banco)"
        run: bash core/valida_banco.sh
